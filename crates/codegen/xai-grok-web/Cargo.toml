[package]
license = "Apache-2.0"
name = "xai-grok-web"
version = "0.1.0"
edition.workspace = true
description = "Web UI server for Grok Build (OpenCode-style frontend)"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = { workspace = true }
ptyctl = { workspace = true }
rust-embed = { workspace = true, optional = true }
# Reused from xai-grok-shell: the ACP agent WebSocket server router.
xai-grok-shell = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
webbrowser = { workspace = true }
xai-grok-config = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
daemonize = { workspace = true }

[features]
# Embed the compiled web frontend (web/dist) into the binary. When disabled,
# `grok web` still serves the ACP endpoint and returns a notice page for the
# static assets. Requires `bun run build` in web/ before building.
default = []
web-ui = ["dep:rust-embed"]
